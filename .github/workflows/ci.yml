name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release line (package.json engines) and the current LTS.
        node: [22, 24]
    env:
      # Keep the MongoDB binary used by the API tests outside node_modules, so it can be cached.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Also builds the internal packages (postinstall).
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # API and web production builds, plus the Android JS bundle of the mobile app.
      - name: Build
        run: npm run build

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Create .env
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" > .env

      # --wait returns once every container reports healthy.
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: npm run smoke

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
