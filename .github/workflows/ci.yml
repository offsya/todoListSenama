name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release line (package.json engines) and the current LTS.
        node: [22, 24]
    env:
      # Keep the MongoDB binary used by the API tests outside node_modules, so it can be cached.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Also builds the internal packages (postinstall).
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # API and web production builds, plus the Android JS bundle of the mobile app.
      - name: Build
        run: npm run build

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # No .env on purpose: the stack must work without any configuration (the API generates its
      # JWT secret). --wait returns once every container reports healthy.
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: npm run smoke

      # The single-container image for Docker Desktop's "Run" button, on the same ports.
      - name: Build and start the all-in-one image
        run: |
          docker compose down -v
          docker build --target all-in-one -t todolistsenamasoft:all-in-one .
          docker run -d --name all-in-one -p 8080:8080 -p 8082:8082 -p 4000:4000 \
            todolistsenamasoft:all-in-one
          timeout 180 sh -c \
            'until [ "$(docker inspect -f "{{.State.Health.Status}}" all-in-one)" = healthy ]; do sleep 2; done'

      - name: Smoke test the all-in-one image
        run: npm run smoke

      # The Expo dev server for Expo Go: the manifest must point the phone at the given address.
      - name: Build and start the Expo dev server image
        run: |
          docker build --target expo -t todolistsenamasoft:expo .
          docker run -d --name expo -p 8081:8081 -e REACT_NATIVE_PACKAGER_HOSTNAME=192.0.2.10 \
            todolistsenamasoft:expo
          timeout 180 sh -c \
            'until [ "$(docker inspect -f "{{.State.Health.Status}}" expo)" = healthy ]; do sleep 2; done'
          curl -fsS -H 'expo-platform: android' -H 'Accept: application/expo+json' \
            http://localhost:8081 | grep -q '"hostUri":"192.0.2.10:8081"'

      - name: Mobile tests in the Expo image
        run: docker run --rm todolistsenamasoft:expo npm test

      - name: Container logs
        if: failure()
        run: |
          docker compose logs
          docker logs all-in-one || true
          docker logs expo || true

      - name: Clean up
        if: always()
        run: |
          docker rm -fv all-in-one expo || true
          docker compose down -v
