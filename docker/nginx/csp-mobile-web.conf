# Content-Security-Policy of the web build of the Expo app. The exported index.html has an
# inline style reset, and react-native-web and expo-font add <style> elements at runtime, so
# styles need 'unsafe-inline'. Scripts are as strict as in the web app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
