# Serves a single-page app and forwards /api/* to the API container, so the browser talks to
# one origin and needs no CORS. Shared by the web and the mobile-web images; each image brings
# its own Content-Security-Policy as /etc/nginx/csp.conf.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers are added per static location below: API responses already carry them
    # (helmet), and add_header at this level would duplicate them.

    # Resolve the API through Docker's DNS on every request (not once at startup), so nginx keeps
    # working when the API container restarts with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed build output can be cached for good.
    location ~ ^/(assets|_expo)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Any other path is a client-side route: serve the app and never cache index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # For browsers without CSP frame-ancestors support.
        add_header X-Frame-Options DENY always;
        include /etc/nginx/csp.conf;
        try_files $uri $uri/ /index.html;
    }
}
