# The API on port 4000, for clients that call it directly: the mobile app on a phone or an
# emulator. The API container itself is not published. Its rate limits trust X-Forwarded-For
# from one proxy, so every request has to pass through nginx, which appends the address of the
# real client to that header. Part of the web image only.
server {
    listen 4000;
    server_name _;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;

    location / {
        proxy_pass $api_upstream;
        # Attachments are up to 5 MB; the API itself enforces the exact limit.
        client_max_body_size 6m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
