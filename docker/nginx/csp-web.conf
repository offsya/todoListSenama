# Content-Security-Policy of the web app. The Vite build has no inline scripts or styles, so
# nothing but the app's own files may run, and the token in localStorage stays out of reach of
# injected markup.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
