# The whole stack in Docker, no configuration needed:
#   docker compose up -d --build
#
#   http://localhost:8080   web app
#   http://localhost:8082   mobile app (web build of the Expo app)
#   http://localhost:4000   API (for the mobile app on a phone or emulator)
#
# Optional settings go to .env (see .env.example).
# Only MongoDB, for local development with `npm run dev`:  docker compose up -d mongo
#
# The images are named after the Docker Hub repository; publish an update with
#   docker compose --profile expo build && docker compose --profile expo push
# deploy/docker-compose.yml runs them from Docker Hub without the source code; keep the two in sync.
#
# Compose project and image names must be lowercase; containers keep the project's name.
name: todolistsenamasoft

services:
  mongo:
    image: mongo:8
    container_name: todoListSenamaSoft-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # For `npm run dev` and database tools on this machine only: MongoDB runs without a password
    # here, so it must not be reachable from the network. The API connects over Compose's network.
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    image: offsya/todolistsenamasoft:api
    container_name: todoListSenamaSoft-api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/todo-app
      # Unset: the API generates a random secret on the first start and keeps it in api-data.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Every request comes through nginx, which sets X-Forwarded-For; rate limiting must see
      # client IPs.
      TRUST_PROXY: 1
    volumes:
      - api-data:/var/lib/todo-api
    # No published port: with TRUST_PROXY, a client talking to the API directly could choose its
    # own IP for the rate limiter. The web service publishes the API on port 4000 instead.
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    image: offsya/todolistsenamasoft:web
    container_name: todoListSenamaSoft-web
    restart: unless-stopped
    ports:
      - '8080:80'
      # The API behind nginx (docker/nginx/api-gateway.conf).
      - '4000:4000'
    depends_on:
      api:
        condition: service_healthy

  mobile-web:
    build:
      context: .
      target: mobile-web
    image: offsya/todolistsenamasoft:mobile-web
    container_name: todoListSenamaSoft-mobile-web
    restart: unless-stopped
    ports:
      - '8082:80'
    depends_on:
      api:
        condition: service_healthy

  # Expo dev server for Expo Go on a phone; not part of `up` (profile), started with
  #   EXPO_HOST=192.168.1.10 docker compose --profile expo up expo
  # where EXPO_HOST is this computer's LAN address. The app calls the API on port 4000 of the same
  # address. From Docker Hub, scripts/start-expo.bat does the same without the source code.
  expo:
    build:
      context: .
      target: expo
    image: offsya/todolistsenamasoft:expo
    container_name: todoListSenamaSoft-expo
    profiles: [expo]
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_HOST:-}
    ports:
      - '8081:8081'
    # Expo's keyboard shortcuts (r reloads, j opens the debugger) after `docker attach`.
    stdin_open: true
    tty: true
    depends_on:
      web:
        condition: service_healthy

volumes:
  mongo-data:
  api-data:
