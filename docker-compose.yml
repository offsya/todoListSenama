# The whole stack in Docker:
#   cp .env.example .env      # and set JWT_SECRET
#   docker compose up -d --build
#
#   http://localhost:8080   web app
#   http://localhost:8082   mobile app (web build of the Expo app)
#   http://localhost:4000   API (for the mobile app on a phone or emulator)
#
# Only MongoDB, for local development with `npm run dev`:  docker compose up -d mongo
#
# Compose project and image names must be lowercase; containers keep the project's name.
name: todolistsenamasoft

services:
  mongo:
    image: mongo:8
    container_name: todoListSenamaSoft-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    image: todolistsenamasoft/api
    container_name: todoListSenamaSoft-api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/todo-app
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # nginx in front of the API sets X-Forwarded-For; rate limiting must see client IPs.
      TRUST_PROXY: 1
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    image: todolistsenamasoft/web
    container_name: todoListSenamaSoft-web
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

  mobile-web:
    build:
      context: .
      target: mobile-web
    image: todolistsenamasoft/mobile-web
    container_name: todoListSenamaSoft-mobile-web
    restart: unless-stopped
    ports:
      - '8082:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
